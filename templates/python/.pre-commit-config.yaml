repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict

  # All tools use venv versions from ci-constraints.txt (single source of truth)
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ./scripts/wt_run.sh ruff check --fix
        language: system
        types: [python]
        require_serial: true
      - id: ruff-format
        name: ruff-format
        entry: ./scripts/wt_run.sh ruff format
        language: system
        types: [python]
        require_serial: true
      - id: mypy
        name: mypy
        entry: ./scripts/wt_run.sh mypy src/__PROJECT_NAME__
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: ./scripts/wt_run.sh pytest --cov=src/__PROJECT_NAME__ --cov-fail-under=90
        language: system
        pass_filenames: false
