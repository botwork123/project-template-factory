repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: typing-imports
        name: typing-imports
        entry: python3 scripts/check_typing_imports.py
        language: system
      - id: semgrep-import-policy
        name: semgrep-import-policy
        entry: semgrep --error --config .semgrep/rules/import-policy.yml
        language: system
        types: [python]
      - id: semgrep-guardrails
        name: semgrep-guardrails
        entry: semgrep --error --config .semgrep/rules/guardrails.yml
        language: system
        types: [python]
      - id: semgrep-python-ethos
        name: semgrep-python-ethos
        entry: semgrep --error --config .semgrep/rules/python-ethos.yml
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: mypy src/__PROJECT_NAME__
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: pytest --cov=src/__PROJECT_NAME__ --cov-fail-under=90
        language: system
        pass_filenames: false
