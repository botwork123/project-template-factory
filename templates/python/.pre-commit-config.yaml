repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy src/__PROJECT_NAME__
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: pytest --cov=src/__PROJECT_NAME__ --cov-fail-under=90
        language: system
        pass_filenames: false
