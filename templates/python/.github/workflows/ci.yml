name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  notify_start:
    name: ci / notify_start
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Notify bot start (CI_not)
        env:
          # Preferred notifier wiring (aligned with openob/skeleton)
          CI_not_TOKEN: ${{ vars.CI_not_TOKEN }}
          CI_not_CHAT_ID: ${{ vars.CI_not_CHAT_ID }}
          # Backward compatibility fallbacks
          CI_NOTIFIER_TOKEN: ${{ secrets.CI_NOTIFIER_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          case "$PR_AUTHOR" in
            forgejo-claude|botwork123) MENTION="@Claude" ;;
            forgejo-gpt)               MENTION="@GPT" ;;
            forgejo-gpt2)              MENTION="@GPT2" ;;
            *)                         MENTION="@Claude" ;;
          esac

          BOT_TOKEN="${CI_not_TOKEN:-$CI_NOTIFIER_TOKEN}"
          CHAT_ID="${CI_not_CHAT_ID:-$TELEGRAM_CHAT_ID}"
          MSG="${MENTION} CI Started - PR #${PR_NUMBER} (${BRANCH}) ${PR_URL}"

          if [[ -n "$BOT_TOKEN" && -n "$CHAT_ID" ]]; then
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d chat_id="${CHAT_ID}" \
              -d text="${MSG}" || true
          else
            echo "Notifier not configured (missing CI_not/legacy token or chat id); skipping Telegram alert"
          fi

  lint:
    name: ci / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.7
      - uses: actions/setup-python@v5.1.1
        with:
          python-version: "3.10"
      - run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run: echo "$HOME/.local/bin" >> $GITHUB_PATH
      - run: ./scripts/wt_env.sh
      - name: Run linters (all files)
        run: |
          set -euo pipefail
          HOOKS=(trailing-whitespace end-of-file-fixer check-yaml check-merge-conflict ruff ruff-format)
          for hook in "${HOOKS[@]}"; do
            ./scripts/wt_run.sh pre-commit run "$hook" --all-files
          done

  imports:
    name: ci / imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.7
      - uses: actions/setup-python@v5.1.1
        with:
          python-version: "3.10"
      - run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run: echo "$HOME/.local/bin" >> $GITHUB_PATH
      - run: ./scripts/wt_env.sh
      - name: Run import checks (all files)
        run: |
          set -euo pipefail
          HOOKS=(typing-imports semgrep-import-policy semgrep-guardrails semgrep-python-ethos)
          for hook in "${HOOKS[@]}"; do
            ./scripts/wt_run.sh pre-commit run "$hook" --all-files
          done

  semgrep_external_audit:
    if: github.event_name == 'push'
    name: ci / semgrep_external_audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.7
      - uses: actions/setup-python@v5.1.1
        with:
          python-version: "3.10"
      - run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run: echo "$HOME/.local/bin" >> $GITHUB_PATH
      - run: ./scripts/wt_env.sh
      - name: Run external packs (blocking on findings)
        run: |
          mkdir -p artifacts
          ./scripts/wt_run.sh semgrep --config p/ci --json --output artifacts/semgrep-p-ci.json src tests || true
          ./scripts/wt_run.sh semgrep --config p/python --json --output artifacts/semgrep-p-python.json src tests || true
          ./scripts/wt_run.sh semgrep --config p/trailofbits --json --output artifacts/semgrep-p-trailofbits.json src tests || true
          for report in artifacts/semgrep-p-ci.json artifacts/semgrep-p-python.json artifacts/semgrep-p-trailofbits.json; do
            findings=$(python3 -c 'import json,sys;print(len(json.load(open(sys.argv[1])).get("results",[])))' "$report")
            echo "$report findings=$findings"
            test "$findings" -eq 0
          done
      - uses: actions/upload-artifact@v3.1.3
        if: always()
        with:
          name: semgrep-external-audit
          if-no-files-found: ignore
          path: |
            artifacts/semgrep-p-ci.json
            artifacts/semgrep-p-python.json
            artifacts/semgrep-p-trailofbits.json

  mypy:
    name: ci / mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.7
      - uses: actions/setup-python@v5.1.1
        with:
          python-version: "3.10"
      - run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run: echo "$HOME/.local/bin" >> $GITHUB_PATH
      - run: ./scripts/wt_env.sh
      - name: Run mypy
        run: |
          set -o pipefail
          mkdir -p artifacts
          ./scripts/wt_run.sh mypy src/__PROJECT_NAME__ 2>&1 | tee artifacts/mypy.txt
      - uses: actions/upload-artifact@v3.1.3
        with:
          name: mypy-report
          path: artifacts/mypy.txt

  test:
    name: ci / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.7
      - uses: actions/setup-python@v5.1.1
        with:
          python-version: "3.10"
      - run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run: echo "$HOME/.local/bin" >> $GITHUB_PATH
      - run: ./scripts/wt_env.sh
      - name: Assert generated .env.example has no drift
        run: |
          ./scripts/wt_run.sh python scripts/generate_env_example.py
          git diff --exit-code -- .env.example
      - name: Run tests + coverage
        run: |
          set -o pipefail
          mkdir -p artifacts
          ./scripts/wt_run.sh pytest --cov=__PROJECT_NAME__ --cov-report=xml:artifacts/coverage.xml --cov-fail-under=90 \
            2>&1 | tee artifacts/pytest.txt
      - uses: actions/upload-artifact@v3.1.3
        with:
          name: test-report
          path: artifacts/pytest.txt
      - uses: actions/upload-artifact@v3.1.3
        with:
          name: coverage-report
          path: artifacts/coverage.xml

  cycles:
    name: ci / cycles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.7
      - uses: actions/setup-python@v5.1.1
        with:
          python-version: "3.10"
      - name: Detect import cycles
        run: |
          set -o pipefail
          mkdir -p artifacts
          python3 scripts/detect_import_cycles.py --fail-on new | tee artifacts/import-cycle-report.txt
      - uses: actions/upload-artifact@v3.1.3
        with:
          name: cycle-report
          if-no-files-found: ignore
          path: artifacts/import-cycle-report.txt

  docker_smoke:
    name: ci / docker_smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.7
      - name: Build runtime image
        run: docker build -t __PROJECT_NAME__:ci .

  prefect_scaffold:
    name: ci / prefect_scaffold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.7
      - name: Validate Prefect scaffold wiring
        run: |
          grep -q 'entrypoint: "src/__PROJECT_NAME__/main.py:main"' prefect.yaml
          grep -q 'python", "-m", "__PROJECT_NAME__.main"' Dockerfile

  report:
    name: ci / report
    runs-on: ubuntu-latest
    needs: [lint, imports, mypy, test, cycles, docker_smoke, prefect_scaffold]
    if: github.event_name == 'pull_request'
    steps:
      - name: Publish CI summary
        run: |
          echo "Python template CI lanes complete." >> "$GITHUB_STEP_SUMMARY"

  protection_gate:
    name: ci / protection_gate
    runs-on: ubuntu-latest
    needs: [lint, imports, mypy, test, cycles, docker_smoke, prefect_scaffold, report]
    if: always()
    steps:
      - name: Enforce required jobs
        run: |
          set -euo pipefail
          NEEDS='${{ toJson(needs) }}'
          echo "$NEEDS"
          echo "$NEEDS" | grep -q '"result":"failure"' && exit 1 || true
          echo "$NEEDS" | grep -q '"result":"cancelled"' && exit 1 || true
