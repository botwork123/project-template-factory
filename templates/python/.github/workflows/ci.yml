name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: curl -LsSf https://astral.sh/uv/0.7.9/install.sh | sh
      - run: echo "$HOME/.local/bin" >> $GITHUB_PATH
      - run: ./scripts/wt_bootstrap.sh
      - run: ./scripts/wt_run.sh ruff check .
      - run: ./scripts/wt_run.sh ruff format --check .

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: curl -LsSf https://astral.sh/uv/0.7.9/install.sh | sh
      - run: echo "$HOME/.local/bin" >> $GITHUB_PATH
      - run: ./scripts/wt_bootstrap.sh
      - run: ./scripts/wt_run.sh mypy src/__PROJECT_NAME__

  imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: curl -LsSf https://astral.sh/uv/0.7.9/install.sh | sh
      - run: echo "$HOME/.local/bin" >> $GITHUB_PATH
      - run: ./scripts/wt_bootstrap.sh
      - run: ./scripts/wt_run.sh python scripts/detect_import_cycles.py --fail-on new --baseline scripts/import_cycle_baseline.txt

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: curl -LsSf https://astral.sh/uv/0.7.9/install.sh | sh
      - run: echo "$HOME/.local/bin" >> $GITHUB_PATH
      - run: ./scripts/wt_bootstrap.sh
      - run: ./scripts/wt_run.sh pytest --cov=src/__PROJECT_NAME__ --cov-fail-under=90

  report:
    if: always()
    needs: [lint, mypy, imports, test]
    runs-on: ubuntu-latest
    steps:
      - name: Report lane results
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "mypy=${{ needs.mypy.result }}"
          echo "imports=${{ needs.imports.result }}"
          echo "test=${{ needs.test.result }}"

  protection_gate:
    if: always()
    needs: [lint, mypy, imports, test, report]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if required lane failed
        run: |
          set -euo pipefail
          results="${{ needs.lint.result }} ${{ needs.mypy.result }} ${{ needs.imports.result }} ${{ needs.test.result }}"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "required lane failed: $results"
              exit 1
            fi
          done
